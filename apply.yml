---
- name: Declarative Kubernetes Namespace Management
  hosts: all
  gather_facts: false
  vars:
    openbao_address: "{{ lookup('env', 'OPENBAO_ADDR') | default('https://openbao.internal:8200', true) }}"
    openbao_token: "{{ lookup('env', 'OPENBAO_TOKEN') | default('', true) }}"
  tasks:
    - name: Teardown resources
      when: state | default('present') == 'absent'
      block:
        - name: Destroy ResourceQuotas & LimitRanges
          ansible.builtin.include_role:
            name: resource_quota

        - name: Destroy Namespace
          ansible.builtin.include_role:
            name: namespace

    - name: Provision resources
      when: not (state | default('present') == 'absent')
      block:
        - name: Provision Namespace
          ansible.builtin.include_role:
            name: namespace

        - name: Apply ResourceQuotas & LimitRanges
          ansible.builtin.include_role:
            name: resource_quota

        # - name: Role 3 - Generate and Sync Secrets
        #   ansible.builtin.include_role:
        #     name: secrets_manager


        # - name: Role 5 - Apply Network Policies (MetalLB & Envoy Aware)
        #   ansible.builtin.include_role:
        #     name: network_policy

        # - name: Role 6 - Grant RBAC Access
        #   ansible.builtin.include_role:
        #     name: rbac