---
- name: Declarative Kubernetes Namespace Management
  hosts: all
  gather_facts: false
  tasks:
    - name: Teardown resources
      when: state | default('present') == 'absent'
      block:
        - name: Destroy External Secrets
          ansible.builtin.include_role:
            name: external-secrets

        - name: Destroy ResourceQuotas & LimitRanges
          ansible.builtin.include_role:
            name: resource-quota

        - name: Destroy Namespace
          ansible.builtin.include_role:
            name: namespace

    - name: Provision resources
      when: not (state | default('present') == 'absent')
      block:
        - name: Provision Namespace
          ansible.builtin.include_role:
            name: namespace

        - name: Apply ResourceQuotas & LimitRanges
          ansible.builtin.include_role:
            name: resource-quota

        - name: Apply External Secrets via Operator
          ansible.builtin.include_role:
            name: external-secrets


