ansible_connection: local

namespace_resource_defaults:
  requests:
    enabled: false
    cpu: "400m"
    memory: "100Mi"
  limits:
    enabled: false
    cpu: "800m"
    memory: "300Mi"

container_resource_defaults:
  resources:
    requests:
      enabled: false
      cpu: "200m"
      memory: "100Mi"
    limits:
      enabled: false
      cpu: "800m"
      memory: "300Mi"    

externalSecretes_defaults:
  clusterSecretStore:
    name: "openbao"
  refreshInterval: "1h"
