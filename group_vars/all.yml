ansible_connection: local

namespace_resource_defaults:
  requests:
    enabled: false
    cpu: "400m"
    memory: "100Mi"
  limits:
    enabled: false
    cpu: "800m"
    memory: "300Mi"

container_resource_defaults:
  resources:
    requests:
      enabled: false
      cpu: "200m"
      memory: "100Mi"
    limits:
      enabled: false
      cpu: "800m"
      memory: "300Mi"

externalSecrets_defaults:
  clusterSecretStore:
    name: "openbao"
  refreshInterval: "1h"
  remoteRefKeyPrefix: "eso"

httpRoutes_defaults:
  gateway:
    internal:
      name: internal
      namespace: envoy-gateway-system
    external:
      name: external
      namespace: envoy-gateway-system

dns_defaults:
  external:
    name: .songin.net
    targets:
      - 84.240.52.225
    ttl: 300
    providerSpecific:
      - name: cloudflare/proxied
        value: "false"
  internal:
    name: .internal.songin.net
    ttl: 300
